name: Release

# Cutting a release is `git tag v0.0.5 && git push --tags`. Everything after
# that happens here rather than on a laptop, and that is the point: the zip and
# the npm tarball each leave with a provenance attestation GitHub signs, so
# anyone can tie the binary they downloaded back to the commit it was built
# from. The commands to check both are in SECURITY.md.
#
# Secrets, set once under Settings > Secrets and variables > Actions:
#
#   PLONK_SIGN_CERT_P12       the "Plonk Signing" certificate and its key, base64
#   PLONK_SIGN_CERT_PASSWORD  the password used when exporting it
#
# and, once there is a paid Apple Developer account, the five that replace them:
#
#   APPLE_DEVELOPER_ID_P12    the "Developer ID Application" certificate, base64
#   APPLE_DEVELOPER_ID_PASSWORD  the password used when exporting it
#   APPLE_NOTARY_KEY          the App Store Connect .p8 API key, base64
#   APPLE_NOTARY_KEY_ID       the key's ten-character ID
#   APPLE_NOTARY_ISSUER       the issuer UUID the key was created under
#
# Set the first of those five and this workflow switches paths on its own:
# Developer ID signing, notarization, a stapled ticket and a .dmg beside the
# zip. Leave them unset and it behaves exactly as it did before they existed.
# There is no flag to flip and nothing to remember on release day.
#
# An API key rather than an Apple ID and an app-specific password, because
# notarytool cannot be asked anything on a runner: a key is three values that go
# in as secrets, and it can be revoked by itself without disturbing the account
# it belongs to.
#
# The switch is not free, and it is one-way. A Developer ID signature is a
# different designated requirement, so scripts/release-requirement has to change
# in the same commit — and every copy already installed will refuse the update,
# the way 0.0.5 did. See SECURITY.md; the reason to do it early is that the bill
# is proportional to how many people are already running it.
#
# npm needs no secret at all: plonk-mcp names this repository and this workflow
# file as a trusted publisher (npmjs.com > the package > Settings > Trusted
# publisher), and npm takes GitHub's OIDC token as proof. Nothing to rotate,
# nothing to leak.
#
# The first two come from ./scripts/make-signing-cert.sh, which prints both.
# The certificate is deliberately generated as a file rather than in the
# keychain: macOS will not export a private key that was born there except
# through the Keychain Access window, and a release pipeline cannot depend on
# someone clicking through it.
#
# That key is worth guarding. It is not a Gatekeeper identity and proves
# nothing to Apple, but every installed copy of Plonk will install an update
# signed with it — and only one signed with it. Losing it means no user can
# auto-update again; leaking it means someone else can offer them a build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  app:
    runs-on: macos-15
    permissions:
      contents: write # create the release, upload the zip
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          set -eu
          . ./version.env
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          # version.env is the one source of truth for the release number, so a
          # tag that disagrees with it is a mistake worth catching before a
          # build goes out under the wrong name.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$MARKETING_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION=$MARKETING_VERSION in version.env"
            exit 1
          fi

      # One step for both identities, because the keychain dance is the same
      # either way: create, import, unlock, and tell codesign it may use the key
      # without stopping to ask. Only two lines differ, and they are the two
      # that matter — a self-signed root has to be trusted before macOS counts
      # it as a valid identity at all, and a Developer ID already chains to a
      # root every Mac ships with, so trusting it by hand would be a lie about
      # where it came from.
      - name: Import the signing certificate
        id: signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          P12: ${{ secrets.PLONK_SIGN_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.PLONK_SIGN_CERT_PASSWORD }}
        run: |
          set -eu
          # A Developer ID wins when both are present. Having set it up, nobody
          # means "sign the next release with the old key anyway", and a release
          # that quietly took the lesser path would be discovered by its users.
          if [ -n "${DEVELOPER_ID_P12:-}" ]; then
            PAYLOAD=$DEVELOPER_ID_P12
            PAYLOAD_PASSWORD=${DEVELOPER_ID_PASSWORD:-}
            WANTED="Developer ID Application"
            SELF_SIGNED=no
          elif [ -n "${P12:-}" ]; then
            PAYLOAD=$P12
            PAYLOAD_PASSWORD=${P12_PASSWORD:-}
            WANTED="Plonk Signing"
            SELF_SIGNED=yes
          else
            echo "::error::neither APPLE_DEVELOPER_ID_P12 nor PLONK_SIGN_CERT_P12 is set — see the header of this workflow"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/plonk-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          P12_FILE="$RUNNER_TEMP/signing.p12"
          CERT_FILE="$RUNNER_TEMP/signing.pem"

          printf '%s' "$PAYLOAD" | base64 --decode > "$P12_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$PAYLOAD_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # "Plonk Signing" is a self-signed root, so nothing on a fresh runner
          # vouches for it and `find-identity -v` — which build.sh checks —
          # leaves it out until the system keychain is told to trust it. The
          # certificate is read back out of the keychain rather than out of the
          # .p12, which would need an openssl new enough for -legacy and the
          # one on the runner is not it.
          if [ "$SELF_SIGNED" = yes ]; then
            security find-certificate -c "Plonk Signing" -p "$KEYCHAIN" > "$CERT_FILE"
            sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain "$CERT_FILE"
          fi

          # codesign would otherwise stop to ask for the key, and there is
          # nobody here to answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$P12_FILE" "$CERT_FILE"

          if ! security find-identity -v -p codesigning | grep -q "$WANTED"; then
            echo "::error::the imported certificate is not a valid codesigning identity named \"$WANTED\""
            security find-identity -v -p codesigning
            exit 1
          fi

          # The full name, not the prefix matched above: a Developer ID carries
          # the account and team in it, which nothing here knows in advance, and
          # release.sh reads the identity rather than guessing at it.
          IDENTITY=$(security find-identity -v -p codesigning |
            sed -n "s/.*\"\($WANTED[^\"]*\)\".*/\1/p" | head -1)
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          if [ "$SELF_SIGNED" = yes ]; then
            echo "notarize=no" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "signing with \"$IDENTITY\""

      # notarytool has nobody to prompt here, so the credentials arrive as an
      # App Store Connect key written to a file for the length of the job. The
      # laptop path is unchanged and still a keychain profile; release.sh picks
      # whichever it was given.
      - name: Write the notarization key
        if: steps.signing.outputs.notarize == 'yes'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -eu
          # Caught here rather than after the build: a Developer ID with no key
          # beside it signs everything correctly and then fails on the upload,
          # twenty minutes of runner later.
          if [ -z "${NOTARY_KEY:-}" ] || [ -z "${NOTARY_KEY_ID:-}" ] || [ -z "${NOTARY_ISSUER:-}" ]; then
            echo "::error::APPLE_DEVELOPER_ID_P12 is set, so this release has to be notarized, but APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER are not all there"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          {
            echo "PLONK_NOTARY_KEY=$KEY_FILE"
            echo "PLONK_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "PLONK_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Test
        run: ./scripts/test.sh

      - name: Build, sign and package
        env:
          PLONK_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./scripts/release.sh

      # The key is gone from the runner before anything else runs, rather than
      # left to the cleanup that usually happens. `always()`, because the build
      # failing is not a reason to leave it lying there.
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

      # What ties Plonk-<version>.zip to this repository, this commit and this
      # workflow run. Without it the app's own promises are only checkable at
      # runtime, on a binary nobody can trace back to the source.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: Plonk-${{ steps.version.outputs.version }}.zip

      # The image is a separate artifact and gets its own statement. Ticking
      # only the zip would leave the download most people take unattested.
      - uses: actions/attest-build-provenance@v4
        if: steps.signing.outputs.notarize == 'yes'
        with:
          subject-path: Plonk-${{ steps.version.outputs.version }}.dmg

      - name: Publish the archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          ZIP="Plonk-$VERSION.zip"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)

          STATE=$(gh release view "v$VERSION" --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)

          # A published release is already out in the world: its sha256 is what
          # the Homebrew cask pins and what anyone who checked the download
          # wrote down, and a rebuild is not byte-identical, so replacing the
          # asset would break both. Re-running this workflow against one is a
          # mistake, not a redeploy — bump version.env and tag again.
          if [ "$STATE" = published ]; then
            echo "::error::v$VERSION is already published; bump version.env and tag a new release instead"
            exit 1
          fi

          # New releases land as drafts, so nothing reaches the updater before
          # someone has said what changed.
          if [ "$STATE" = missing ]; then
            gh release create "v$VERSION" --draft --title "Plonk $VERSION" --notes "$(
              printf '%s\n' \
                "Drafted by CI. Replace this with the release notes before publishing." \
                "" \
                "Built from \`$GITHUB_SHA\` by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." \
                "Verify it against that commit before installing:" \
                "" \
                '```sh' \
                "gh attestation verify $ZIP -R $GITHUB_REPOSITORY" \
                '```' \
                "" \
                "sha256: \`$SHA\`"
            )"
          fi
          gh release upload "v$VERSION" "$ZIP" --clobber

          {
            echo "### Plonk $VERSION"
            echo
            echo "- zip sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Only there on the notarized path, so its absence is the normal case
          # rather than a missing file worth failing over.
          DMG="Plonk-$VERSION.dmg"
          if [ -f "$DMG" ]; then
            gh release upload "v$VERSION" "$DMG" --clobber
            echo "- dmg sha256: \`$(shasum -a 256 "$DMG" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "- update the cask in \`ostapondo/homebrew-plonk\` with that version and sha256" \
            >> "$GITHUB_STEP_SUMMARY"

  mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both halves of trusted publishing: it is what npm authenticates this
      # workflow by, and what it records the tarball's origin from.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # Node 24 for npm 11, which is the first that can publish over OIDC.
      #
      # No registry-url on purpose. Given one, setup-node writes an .npmrc with
      # an auth line and fills it with a placeholder when no token is passed —
      # npm then authenticates with "XXXXX-XXXXX-XXXXX-XXXXX", gets a 404, and
      # never tries OIDC at all, because OIDC is what it falls back to only
      # when nothing else claims to be a credential. The default registry is
      # registry.npmjs.org anyway.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
        working-directory: mcp

      - name: Check the version against version.env
        id: version
        run: |
          set -eu
          . ./version.env
          PACKAGE=$(node -p "require('./mcp/package.json').version")
          if [ "$PACKAGE" != "$MARKETING_VERSION" ]; then
            echo "::error::mcp/package.json is $PACKAGE but version.env says $MARKETING_VERSION"
            exit 1
          fi
          # server.json carries the version twice — the server's own, and the
          # npm package it points at — and the registry believes both. Left
          # behind, it advertises an older release than this run is shipping,
          # which is exactly how the listing ended up four versions stale.
          SERVER=$(node -p "require('./mcp/server.json').version")
          SERVER_PACKAGE=$(node -p "require('./mcp/server.json').packages[0].version")
          if [ "$SERVER" != "$MARKETING_VERSION" ] || [ "$SERVER_PACKAGE" != "$MARKETING_VERSION" ]; then
            echo "::error::mcp/server.json says $SERVER / $SERVER_PACKAGE but version.env says $MARKETING_VERSION"
            exit 1
          fi
          # The Claude Code plugin carries the version twice as well, and there
          # it decides something: a plugin pinned to a version users already
          # have is a plugin that never updates, however much the code moved.
          PLUGIN=$(node -p "require('./plugins/plonk/.claude-plugin/plugin.json').version")
          CATALOG=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          # And a third time in the server it launches, which is the one that
          # decides what actually runs: a plugin that says 0.2.3 while running
          # whatever npm serves as latest is pinned in name only.
          PINNED=$(node -p "require('./plugins/plonk/.mcp.json').mcpServers.plonk.args.at(-1).split('@').at(-1)")
          if [ "$PLUGIN" != "$MARKETING_VERSION" ] || [ "$CATALOG" != "$MARKETING_VERSION" ] || [ "$PINNED" != "$MARKETING_VERSION" ]; then
            echo "::error::the plugin says $PLUGIN / $CATALOG / $PINNED but version.env says $MARKETING_VERSION"
            exit 1
          fi
          echo "version=$PACKAGE" >> "$GITHUB_OUTPUT"
          # Re-running the workflow for a version already on npm is not a
          # failure, it is a no-op — publishing again would be the failure.
          if npm view "plonk-mcp@$PACKAGE" version > /dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      # No token. npm authenticates this workflow by the OIDC identity GitHub
      # mints for it, against a trusted publisher configured on the package:
      # this repository, this workflow file, nothing else. A token that can
      # publish plonk-mcp therefore does not exist to be leaked, and npm is
      # restricting the 2FA-bypassing tokens this used to need anyway.
      #
      # Provenance comes with it — a signed statement on the registry naming
      # the commit and the run that produced the tarball, which is what
      # `npx -y plonk-mcp` otherwise asks people to take on faith.
      - name: Publish with provenance
        if: steps.version.outputs.published == 'no'
        working-directory: mcp
        run: npm publish --provenance --access public

      - name: Already published
        if: steps.version.outputs.published == 'yes'
        run: echo "plonk-mcp@${{ steps.version.outputs.version }} is already on npm; nothing to do."

      # Being on npm is not the same as being findable. The registry at
      # registry.modelcontextprotocol.io is what MCP clients and directories
      # read to know this server exists, and publishing to it used to be a
      # command someone had to remember — so nobody did, and the listing sat
      # four releases behind the code while advertising half the tools.
      #
      # Same trust model as the npm publish above: no secret. The registry
      # takes GitHub's OIDC token as proof that this workflow, in this
      # repository, owns the io.github.ostapondo namespace. Ownership of the
      # npm package is proved separately, by the mcpName field in
      # package.json naming the same server.
      - name: Publish to the MCP Registry
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=plonk" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                const found=JSON.parse(d).servers.some(e =>
                  e.server.name==='io.github.ostapondo/plonk' && e.server.version===process.argv[1]);
                process.exit(found?0:1)})" "$VERSION"
          then
            echo "$VERSION is already in the registry; nothing to do."
            exit 0
          fi
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          cd mcp && ../mcp-publisher publish

  # The .mcpb bundle is how Claude Desktop installs an MCP server: open the
  # file, confirm, done — no config file to find, no command to paste, which is
  # where most people give up. It is built here rather than on a laptop for the
  # same reason the zip is: it carries the compiled server and a vendored copy
  # of its dependencies, so a bundle packed from a dirty checkout would ship
  # whatever happened to be lying around, signed by nothing.
  bundle:
    runs-on: ubuntu-latest
    # The draft release this uploads to is created by the app job.
    needs: app
    permissions:
      contents: write # upload the bundle to the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
        working-directory: mcp

      - name: Read the version
        id: version
        run: |
          set -eu
          . ./version.env
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"

      - run: ./scripts/build-mcpb.sh

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: mcp/plonk-${{ steps.version.outputs.version }}.mcpb

      - name: Publish the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "v$VERSION" "mcp/plonk-$VERSION.mcpb" --clobber
