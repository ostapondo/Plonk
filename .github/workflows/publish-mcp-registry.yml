name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate listing
        run: |
          node -e 'const fs = require("node:fs");
            const server = JSON.parse(fs.readFileSync("mcp/server.json"));
            const pkg = JSON.parse(fs.readFileSync("mcp/package.json"));
            if (server.description.length > 100 || server.version !== pkg.version ||
                server.packages[0].version !== pkg.version) process.exit(1);'

      - name: Publish listing
        run: |
          set -eu
          VERSION=$(node -p "require('./mcp/server.json').version")
          curl -sf -o registry.json "https://registry.modelcontextprotocol.io/v0/servers?search=plonk"
          if node -e "const found=JSON.parse(require('fs').readFileSync('registry.json','utf8')).servers.some(e =>
                  e.server.name==='io.github.ostapondo/plonk' && e.server.version===process.argv[1]);
                process.exit(found?0:1)" "$VERSION"
          then
            echo "$VERSION is already in the registry; nothing to do."
            exit 0
          fi
          MCP_PUBLISHER_VERSION=1.8.1
          MCP_PUBLISHER_SHA256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          cd mcp && ../mcp-publisher publish
