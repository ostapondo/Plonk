<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 112" width="720" height="112" role="img" aria-label="Five built-in zone sets — Halves, Thirds, 60/40, Quarters, Priority — and a sixth, irregular one drawn by hand">
  <style>
    .frame { fill: none; stroke: #8b949e; stroke-opacity: 0.45; stroke-width: 1.5; }
    .z { fill: #8b7cf6; fill-opacity: 0.18; stroke: #8b7cf6; stroke-opacity: 0.7; stroke-width: 1.5; }
    .c { fill: #d29922; fill-opacity: 0.18; stroke: #d29922; stroke-opacity: 0.8; stroke-width: 1.5; }
    .n { font: 600 12px ui-sans-serif, -apple-system, Segoe UI, sans-serif; fill: #8b949e; text-anchor: middle; }
    .y { font: 600 12px ui-sans-serif, -apple-system, Segoe UI, sans-serif; fill: #d29922; text-anchor: middle; }
  </style>

  <g transform="translate(0 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="z" x="14" y="16" width="44" height="60" rx="3"/>
    <rect class="z" x="62" y="16" width="44" height="60" rx="3"/>
    <text class="n" x="60" y="100">Halves</text>
  </g>

  <g transform="translate(120 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="z" x="14" y="16" width="28" height="60" rx="3"/>
    <rect class="z" x="46" y="16" width="28" height="60" rx="3"/>
    <rect class="z" x="78" y="16" width="28" height="60" rx="3"/>
    <text class="n" x="60" y="100">Thirds</text>
  </g>

  <g transform="translate(240 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="z" x="14" y="16" width="54" height="60" rx="3"/>
    <rect class="z" x="72" y="16" width="34" height="60" rx="3"/>
    <text class="n" x="60" y="100">60 / 40</text>
  </g>

  <g transform="translate(360 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="z" x="14" y="16" width="44" height="28" rx="3"/>
    <rect class="z" x="62" y="16" width="44" height="28" rx="3"/>
    <rect class="z" x="14" y="48" width="44" height="28" rx="3"/>
    <rect class="z" x="62" y="48" width="44" height="28" rx="3"/>
    <text class="n" x="60" y="100">Quarters</text>
  </g>

  <g transform="translate(480 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="z" x="14" y="16" width="54" height="60" rx="3"/>
    <rect class="z" x="72" y="16" width="34" height="28" rx="3"/>
    <rect class="z" x="72" y="48" width="34" height="28" rx="3"/>
    <text class="n" x="60" y="100">Priority</text>
  </g>

  <g transform="translate(600 0)">
    <rect class="frame" x="8" y="10" width="104" height="72" rx="6"/>
    <rect class="c" x="14" y="16" width="26" height="60" rx="3"/>
    <rect class="c" x="44" y="16" width="40" height="28" rx="3"/>
    <rect class="c" x="44" y="48" width="18" height="28" rx="3"/>
    <rect class="c" x="66" y="48" width="18" height="28" rx="3"/>
    <rect class="c" x="88" y="16" width="18" height="60" rx="3"/>
    <text class="y" x="60" y="100">Or yours</text>
  </g>
</svg>
