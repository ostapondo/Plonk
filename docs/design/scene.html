<!doctype html>
<meta charset="utf-8">
<style>
/* Every animation is exactly 3s so the GIF loops without a stutter. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:640px;height:340px;overflow:hidden}
body{
  background:
    radial-gradient(70% 90% at 4% 2%,rgba(255,79,129,.30),transparent 60%),
    radial-gradient(70% 90% at 98% 96%,rgba(58,107,255,.28),transparent 60%),
    radial-gradient(60% 80% at 80% 4%,rgba(255,197,49,.20),transparent 60%),
    #f4f2fa;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  position:relative
}

/* ---------- left: the cube and the wordmark ---------- */
.left{position:absolute;left:34px;top:52px;width:200px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.cube{width:96px;height:108px;animation:bob 3s ease-in-out infinite;display:block}
.cube .eye{transform-box:fill-box;transform-origin:center;animation:blink 3s ease-in-out infinite}
.word{
  font-size:46px;font-weight:900;letter-spacing:-.05em;color:#12101c;margin-top:14px;line-height:1
}
.tag{font-size:14.5px;line-height:1.35;color:#5f5a75;margin-top:9px;font-weight:500;max-width:190px}

/* ---------- right: the screen ---------- */
.screen{
  position:absolute;left:266px;top:52px;width:340px;height:236px;
  border-radius:20px;background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 14px 40px rgba(18,16,28,.14);
  padding:9px
}
.z{
  position:absolute;border-radius:11px;display:flex;align-items:flex-end;padding:8px;
  font:600 12px ui-monospace,"SF Mono",Menlo,monospace;color:#fff
}
.z1{background:linear-gradient(160deg,#ff7fa4,#ff4f81);left:2.5%;top:4%;width:28%;height:92%}
.z2{background:linear-gradient(160deg,#a98cff,#8b5cf6);left:33%;top:4%;width:41%;height:92%}
.z3{background:linear-gradient(160deg,#6f92ff,#3a6bff);left:76.5%;top:4%;width:21%;height:44%}
.z4{background:linear-gradient(160deg,#5ff0cd,#12d3a4);left:76.5%;top:52%;width:21%;height:44%;color:#04241b}

@keyframes lift{
  0%,14%{opacity:.4;transform:scale(.96)}
  26%,72%{opacity:1;transform:scale(1)}
  86%,100%{opacity:.4;transform:scale(.96)}
}
.z{animation:lift 3s ease infinite}
.z1{animation-delay:.03s}
.z3{animation-delay:.06s}
.z4{animation-delay:.09s}

/* the window the cube is carrying — same outline as the cube */
/* Rest position sits beside the cube, clear of the wordmark. It lands
   slightly inside zone 2 rather than over it, so the gradient stays
   visible as a frame — which is also what the gap setting really does. */
@keyframes fly{
  0%,10%{left:-34%;top:5%;width:26%;height:30%}
  38%,72%{left:35.5%;top:8%;width:36%;height:84%}
  92%,100%{left:-34%;top:5%;width:26%;height:30%}
}
.win{
  position:absolute;border-radius:11px;background:#fff;border:2.5px solid #12101c;
  box-shadow:0 14px 28px rgba(18,16,28,.28);animation:fly 3s cubic-bezier(.34,1.3,.4,1) infinite;
  overflow:hidden
}
.win .bar{height:14px;background:#12101c;display:flex;gap:3px;align-items:center;padding:0 6px}
.win .bar i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.7);display:block}
.win .body{padding:10px;display:flex;flex-direction:column;gap:6px}
.win .body u{display:block;height:5px;border-radius:3px;background:#e6e4ef;text-decoration:none}
.win .body u:nth-child(1){width:72%}
.win .body u:nth-child(2){width:92%}
.win .body u:nth-child(3){width:56%}

@keyframes pop{
  0%,26%{opacity:0;transform:translate(-50%,8px)}
  36%,68%{opacity:1;transform:translate(-50%,0)}
  80%,100%{opacity:0;transform:translate(-50%,8px)}
}
.toast{
  position:absolute;left:50%;bottom:16px;transform:translate(-50%,0);
  background:#12101c;color:#fff;border-radius:999px;padding:7px 15px;
  font:600 12.5px -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;white-space:nowrap;
  animation:pop 3s ease infinite
}
.toast b{color:#c4b5ff}
</style>

<div class="left">
  <svg class="cube" viewBox="0 0 100 112">
    <polygon fill="#fffdf9" points="12,34 50,12 88,34 50,56"/>
    <polygon fill="#ff4f81" points="12,34 50,56 50,100 12,78"/>
    <polygon fill="#3a6bff" points="88,34 50,56 50,100 88,78"/>
    <ellipse class="eye" cx="25" cy="63" rx="5.2" ry="6.4" fill="#fffdf9"/>
    <ellipse class="eye" cx="26.2" cy="64.6" rx="2.6" ry="3.2" fill="#12101c"/>
    <ellipse class="eye" cx="39" cy="71" rx="5.2" ry="6.4" fill="#fffdf9"/>
    <ellipse class="eye" cx="40.2" cy="72.6" rx="2.6" ry="3.2" fill="#12101c"/>
    <path d="M27,78 Q33,84 40,81" stroke="#12101c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path fill="none" stroke="#12101c" stroke-width="2.6" stroke-linejoin="round"
          d="M12,34 L50,12 L88,34 L88,78 L50,100 L12,78 Z M12,34 L50,56 L88,34 M50,56 L50,100"/>
  </svg>
  <div class="word">Plonk</div>
  <div class="tag">Give every window a place to live.</div>
</div>

<div class="screen">
  <div class="z z1">1</div>
  <div class="z z2">2</div>
  <div class="z z3">3</div>
  <div class="z z4">4</div>
  <div class="win" style="left:-34%;top:5%;width:26%;height:30%">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body"><u></u><u></u><u></u></div>
  </div>
  <div class="toast">release for <b>zone 2</b></div>
</div>
