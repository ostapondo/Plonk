<!doctype html>
<meta charset="utf-8">
<style>
/* ============================================================
   docs/social-preview.png — the card GitHub, Slack and every
   chat window draw when someone pastes a link.
   640x320 at 2x is 1280x640, which is what GitHub asks for and
   what the file it replaces already was. Nothing here animates:
   this is the banner's rest pose, so the two assets read as the
   same drawing rather than two attempts at one.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:640px;height:320px;overflow:hidden}
body{
  background:
    radial-gradient(70% 90% at 4% 2%,rgba(255,79,129,.30),transparent 60%),
    radial-gradient(70% 90% at 98% 96%,rgba(58,107,255,.28),transparent 60%),
    radial-gradient(60% 80% at 80% 4%,rgba(255,197,49,.20),transparent 60%),
    #f4f2fa;
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  position:relative
}

/* ---------- left: the cube and the wordmark ---------- */
.left{position:absolute;left:38px;top:56px;width:210px}
.cube{width:92px;height:104px;display:block;transform:rotate(-1.5deg)}
.word{font-size:46px;font-weight:900;letter-spacing:-.05em;color:#12101c;margin-top:6px;line-height:1}
.tag{font-size:15px;line-height:1.35;color:#5f5a75;margin-top:10px;font-weight:500;max-width:200px}

/* ---------- right: the screen ---------- */
/* One zone short of the six-hue ceiling, and the same five the site
   calls Priority — a reader who has seen one has seen the other. */
.screen{
  position:absolute;left:270px;top:56px;width:332px;height:208px;
  border-radius:20px;background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 14px 40px rgba(18,16,28,.14);
  padding:9px
}
.z{
  position:absolute;border-radius:11px;display:flex;align-items:flex-end;padding:8px;
  font:600 12px ui-monospace,"SF Mono",Menlo,monospace;color:#fff;
  text-shadow:0 1px 3px rgba(18,16,28,.35)
}
.z1{background:linear-gradient(160deg,#ff7fa4,#ff4f81);left:2.5%;top:4%;width:26%;height:45%}
.z2{background:linear-gradient(160deg,#a98cff,#8b5cf6);left:30.5%;top:4%;width:43%;height:92%}
.z3{background:linear-gradient(160deg,#6f92ff,#3a6bff);left:76%;top:4%;width:21.5%;height:45%}
.z4{background:linear-gradient(160deg,#5ff0cd,#12d3a4);left:2.5%;top:51%;width:26%;height:45%;color:#04241b}
.z5{background:linear-gradient(160deg,#ffe08a,#ffc531);left:76%;top:51%;width:21.5%;height:45%;color:#1c1400}

/* The window lands slightly inside zone 2 rather than over it, so the
   gradient stays visible as a frame — which is what the gap setting
   really does. Same outline as the cube: the two hard-edged things.
   The toast is pushed off centre for one reason: centred, it sat on
   zone 2's own digit, and the whole point is that the number and the
   colour agree. */
.win{
  position:absolute;left:34%;top:9%;width:36%;height:60%;
  border-radius:11px;background:#fff;border:2.5px solid #12101c;
  box-shadow:0 14px 28px rgba(18,16,28,.28);overflow:hidden
}
.win .bar{height:14px;background:#12101c;display:flex;gap:3px;align-items:center;padding:0 6px}
.win .bar i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.7);display:block}
.win .body{padding:10px;display:flex;flex-direction:column;gap:6px}
.win .body u{display:block;height:5px;border-radius:3px;background:#e6e4ef;text-decoration:none}
.win .body u:nth-child(1){width:72%}
.win .body u:nth-child(2){width:92%}
.win .body u:nth-child(3){width:56%}

.toast{
  position:absolute;left:58%;bottom:24px;transform:translateX(-50%);
  background:#12101c;color:#fff;border-radius:999px;padding:7px 15px;
  font:600 12.5px -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;white-space:nowrap
}
.toast b{color:#c4b5ff}
</style>

<div class="left">
  <svg class="cube" viewBox="0 0 100 112">
    <polygon fill="#fffdf9" points="12,34 50,12 88,34 50,56"/>
    <polygon fill="#ff4f81" points="12,34 50,56 50,100 12,78"/>
    <polygon fill="#3a6bff" points="88,34 50,56 50,100 88,78"/>
    <ellipse cx="25" cy="63" rx="5.2" ry="6.4" fill="#fffdf9"/>
    <ellipse cx="26.2" cy="64.6" rx="2.6" ry="3.2" fill="#12101c"/>
    <ellipse cx="39" cy="71" rx="5.2" ry="6.4" fill="#fffdf9"/>
    <ellipse cx="40.2" cy="72.6" rx="2.6" ry="3.2" fill="#12101c"/>
    <path d="M27,78 Q33,84 40,81" stroke="#12101c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path fill="none" stroke="#12101c" stroke-width="2.6" stroke-linejoin="round"
          d="M12,34 L50,12 L88,34 L88,78 L50,100 L12,78 Z M12,34 L50,56 L88,34 M50,56 L50,100"/>
  </svg>
  <div class="word">Plonk</div>
  <div class="tag">Give every window a place to live.</div>
</div>

<div class="screen">
  <div class="z z1">1</div>
  <div class="z z2">2</div>
  <div class="z z3">3</div>
  <div class="z z4">4</div>
  <div class="z z5">5</div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body"><u></u><u></u><u></u></div>
  </div>
  <div class="toast">release for <b>zone 2</b></div>
</div>
