<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172" width="720" height="172" role="img" aria-label="A saved workspace of four apps, closed to an empty desktop, then launched back into place">
  <defs>
    <marker id="wtip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    .frame { fill: none; stroke: #8b949e; stroke-opacity: 0.45; stroke-width: 1.5; }
    .w { fill: #8b7cf6; fill-opacity: 0.18; stroke: #8b7cf6; stroke-opacity: 0.7; stroke-width: 1.5; }
    .ghost { fill: none; stroke: #8b949e; stroke-opacity: 0.3; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .cap { font: 600 12px ui-sans-serif, -apple-system, Segoe UI, sans-serif; fill: #8b949e; text-anchor: middle; }
    .tag { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b7cf6; fill-opacity: 0.9; text-anchor: middle; }
    .link { stroke: #8b949e; stroke-opacity: 0.7; stroke-width: 1.5; fill: none; }
    .lbl { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; fill-opacity: 0.75; text-anchor: middle; }
  </style>

  <g transform="translate(0 0)">
    <rect class="frame" x="12" y="14" width="196" height="118" rx="8"/>
    <rect class="w" x="20" y="22" width="96" height="66" rx="4"/>
    <rect class="w" x="122" y="22" width="78" height="66" rx="4"/>
    <rect class="w" x="20" y="94" width="86" height="30" rx="4"/>
    <rect class="w" x="112" y="94" width="88" height="30" rx="4"/>
    <text class="cap" x="110" y="152">Arrange, then save</text>
    <text class="tag" x="110" y="166">"work"</text>
  </g>

  <line class="link" x1="222" y1="73" x2="264" y2="73" marker-end="url(#wtip)"/>
  <text class="lbl" x="243" y="62">quit</text>

  <g transform="translate(268 0)">
    <rect class="frame" x="12" y="14" width="196" height="118" rx="8"/>
    <rect class="ghost" x="20" y="22" width="96" height="66" rx="4"/>
    <rect class="ghost" x="122" y="22" width="78" height="66" rx="4"/>
    <rect class="ghost" x="20" y="94" width="86" height="30" rx="4"/>
    <rect class="ghost" x="112" y="94" width="88" height="30" rx="4"/>
    <text class="cap" x="110" y="152">Nothing running</text>
  </g>

  <line class="link" x1="490" y1="73" x2="532" y2="73" marker-end="url(#wtip)"/>
  <text class="lbl" x="511" y="62">launch</text>

  <g transform="translate(508 0)">
    <rect class="frame" x="12" y="14" width="196" height="118" rx="8"/>
    <rect class="w" x="20" y="22" width="96" height="66" rx="4"/>
    <rect class="w" x="122" y="22" width="78" height="66" rx="4"/>
    <rect class="w" x="20" y="94" width="86" height="30" rx="4"/>
    <rect class="w" x="112" y="94" width="88" height="30" rx="4"/>
    <text class="cap" x="110" y="152">Opened and placed</text>
  </g>
</svg>
